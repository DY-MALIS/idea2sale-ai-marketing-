name: Autonomous Codex Builder
on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Maximum task window'
        required: true
        type: choice
        options: ['12', '24']
        default: '12'
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: autonomous-codex-builder
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install -g @openai/codex
      # Manual-only until authenticated Telegram approval state machine is implemented.
      - name: Run agent queue
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_HOURS: ${{ inputs.hours || '12' }}
        run: python3 scripts/autonomous_builder.py
