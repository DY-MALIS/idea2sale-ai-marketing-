name: Scheduled posts (Telegram + TikTok + YouTube + Facebook)

on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  # Keep destinations independent: a Telegram/TikTok failure must not skip
  # a due YouTube post. Run them on both schedules so the six-hour usage tick
  # can also recover overdue posts when GitHub delays ten-minute ticks.
  telegram-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger due Telegram posts
        run: |
          OIDC_TOKEN=$(curl --fail --show-error --silent -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Faime.angkorgate.ai%2Fscheduler" | jq -r '.value')
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != null
          curl --fail-with-body --show-error --silent --connect-timeout 10 --max-time 120 -X POST -H "X-GitHub-OIDC-Token: $OIDC_TOKEN" https://aime.angkorgate.ai/api/telegram/run-scheduled

  tiktok-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger due TikTok posts
        run: |
          OIDC_TOKEN=$(curl --fail --show-error --silent -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Faime.angkorgate.ai%2Fscheduler" | jq -r '.value')
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != null
          curl --fail-with-body --show-error --silent --connect-timeout 10 --max-time 120 -X POST -H "X-GitHub-OIDC-Token: $OIDC_TOKEN" "https://aime.angkorgate.ai/api/tiktok/publish?action=cron"

  youtube-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger due YouTube posts
        run: |
          OIDC_TOKEN=$(curl --fail --show-error --silent -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Faime.angkorgate.ai%2Fscheduler" | jq -r '.value')
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != null
          curl --fail-with-body --show-error --silent --connect-timeout 10 --max-time 120 -X POST -H "X-GitHub-OIDC-Token: $OIDC_TOKEN" "https://aime.angkorgate.ai/api/tiktok/publish?action=youtubeCron"

  facebook-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger due Facebook Page posts
        run: |
          OIDC_TOKEN=$(curl --fail --show-error --silent -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Faime.angkorgate.ai%2Fscheduler" | jq -r '.value')
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != null
          curl --fail-with-body --show-error --silent --connect-timeout 10 --max-time 120 -X POST -H "X-GitHub-OIDC-Token: $OIDC_TOKEN" "https://aime.angkorgate.ai/api/tiktok/publish?action=facebookCron"

  usage-check:
    # OpenRouter credit balance and ImageKit's monthly video-transformation
    # quota have each already blocked real generation jobs with no warning
    # (Sep 2026). This pages TELEGRAM_ADMIN_CHAT_ID before either runs out.
    if: github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check OpenRouter/ImageKit usage
        run: |
          OIDC_TOKEN=$(curl --fail --show-error --silent -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Faime.angkorgate.ai%2Fscheduler" | jq -r '.value')
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != null
          curl --fail-with-body --show-error --silent --connect-timeout 10 --max-time 120 -X POST -H "X-GitHub-OIDC-Token: $OIDC_TOKEN" "https://aime.angkorgate.ai/api/telegram/run-scheduled?action=usageCheck"
